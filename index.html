<html lang="nl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voedselbos Maandschema — Quinta do Compasso da Água</title>
<style>
  :root {
    --earth: #3d2b1f;
    --stone: #8a7a6a;
    --sand: #f5efe6;
    --moss: #4a6741;
    --leaf: #7a9e72;
    --water: #4a7a8a;
    --bark: #6b4c3b;
    --sun: #c8882a;
    --cream: #faf6f0;
    --white: #ffffff;
    --border: #ddd4c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--cream);
    color: var(--earth);
    min-height: 100vh;
  }

  header {
    background: var(--earth);
    color: var(--sand);
    padding: 20px 24px 16px;
    border-bottom: 3px solid var(--sun);
  }

  header h1 {
    font-size: 17px;
    font-weight: normal;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }

  header p {
    font-size: 12px;
    color: var(--stone);
    font-family: 'Helvetica Neue', sans-serif;
  }

  .month-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 14px 24px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .month-btn {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 11px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--stone);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .month-btn:hover { border-color: var(--leaf); color: var(--moss); }

  .month-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: var(--white);
  }

  .month-btn.critical { border-color: var(--sun); }
  .month-btn.critical.active { background: var(--sun); border-color: var(--sun); }

  .content { padding: 20px 24px 40px; max-width: 900px; }

  .month-title {
    font-size: 22px;
    font-weight: normal;
    color: var(--earth);
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .month-subtitle {
    font-size: 12px;
    color: var(--stone);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 16px;
  }

  .priorities {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-left: 4px solid var(--sun);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .priorities h3 {
    font-size: 11px;
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 10px;
  }

  .priority-item {
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.4;
  }

  .priority-item:last-child { border-bottom: none; }

  .priority-num {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--sun);
    min-width: 18px;
    padding-top: 1px;
  }

  .category {
    margin-bottom: 18px;
  }

  .category-title {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stone);
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .task-row {
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
    background: var(--white);
    border: 1px solid transparent;
    transition: border-color 0.1s;
  }

  .task-row:hover { border-color: var(--border); }

  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 3px;
  }

  .task-plant {
    font-size: 13px;
    font-weight: 600;
    color: var(--earth);
    line-height: 1.3;
    flex: 1;
    word-break: break-word;
  }

  .task-badge {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    display: inline-block;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .task-note {
    font-size: 12px;
    color: var(--stone);
    line-height: 1.45;
    font-family: 'Helvetica Neue', sans-serif;
  }

  /* Badge colors */
  .b-zaaien   { background: #e8f5e9; color: #2e7d32; }
  .b-planten  { background: #e3f2fd; color: #1565c0; }
  .b-oogsten  { background: #fff3e0; color: #e65100; }
  .b-snoeien  { background: #f3e5f5; color: #6a1b9a; }
  .b-mulchen  { background: #efebe9; color: #4e342e; }
  .b-knippen  { background: #f1f8e9; color: #558b2f; }
  .b-zaad     { background: #fffde7; color: #f57f17; }
  .b-stekken  { background: #e0f2f1; color: #00695c; }
  .b-water    { background: #e1f5fe; color: #0277bd; }
  .b-bestellen{ background: #eceff1; color: #37474f; }
  .b-observeren{ background: #fafafa; color: #616161; }
  .b-bemesten { background: #e8f5e9; color: #1b5e20; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px;
    color: var(--stone);
  }

  .empty-month {
    text-align: center;
    padding: 40px;
    color: var(--stone);
    font-style: italic;
  }

  #searchInput::placeholder { color: var(--stone); opacity: 0.7; }
  .plant-link { 
    cursor: pointer; 
    color: var(--earth);
    border-bottom: 1.5px dashed var(--leaf);
    display: inline;
  }
  .plant-link:hover { color: var(--moss); border-color: var(--moss); }
  .detail-section { margin-bottom: 16px; }
  .detail-section-title { 
    font-family:'Helvetica Neue',sans-serif;
    font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.08em;
    color:var(--stone);margin-bottom:5px;
  }
  .detail-section-body { font-size:13px;line-height:1.6;color:var(--earth); }
  .detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  .detail-grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }
  .detail-box { 
    background:var(--sand);border-radius:6px;
    padding:10px 12px;
  }
  .nutrient-row { 
    display:flex;justify-content:space-between;
    padding:4px 0;border-bottom:1px solid var(--border);
    font-size:12px;font-family:'Helvetica Neue',sans-serif;
  }
  .nutrient-row:last-child { border-bottom:none; }
  .nutrient-value { font-weight:600;color:var(--moss); }
  .back-btn {
    font-family:'Helvetica Neue',sans-serif;font-size:12px;
    padding:6px 12px;border:1.5px solid var(--border);border-radius:4px;
    background:var(--white);cursor:pointer;color:var(--stone);
    margin-bottom:16px;display:inline-block;
  }
  .back-btn:hover { border-color:var(--moss);color:var(--moss); }
  .search-result-month { font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);padding:12px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px; }
  .search-highlight { background:#fff9c4;border-radius:2px;padding:0 1px; }
  .no-results { text-align:center;padding:40px;color:var(--stone);font-style:italic;font-family:'Helvetica Neue',sans-serif; }
  @media (max-width: 600px) {
    .content { padding: 16px; }
    .task-header { flex-wrap: wrap; }
  }
</style>
</head>

let activeMonth = 'sep';



function renderContent() {
  const data = CAL[activeMonth];
  const mInfo = MONTHS.find(m => m.id === activeMonth);
  if (!data) { document.getElementById('content').innerHTML = '<div class="empty-month">Geen data beschikbaar</div>'; return; }

  const priHTML = data.priorities.map((p, i) =>
    `<div class="priority-item"><span class="priority-num">${i+1}</span><span>${p}</span></div>`
  ).join('');

  const catHTML = data.categories.map(cat => {
    const taskHTML = cat.tasks.map(t => {
      const badgeClass = {
        'zaaien':'b-zaaien','planten':'b-planten','oogsten':'b-oogsten',
        'snoeien':'b-snoeien','mulchen':'b-mulchen','knippen':'b-knippen',
        'zaad':'b-zaad','stekken':'b-stekken','water':'b-water',
        'bestellen':'b-bestellen','observeren':'b-observeren','bemesten':'b-bemesten'
      }[t.type] || 'b-observeren';
      return `<div class="task-row">
        <div class="task-header">
          <div class="task-plant">${makePlantClickable(t.plant)}</div>
          <span class="task-badge ${badgeClass}">${t.action}</span>
        </div>
        <div class="task-note">${t.note}</div>
      </div>`;
    }).join('');
    return `<div class="category">
      <div class="category-title">${cat.name}</div>
      ${taskHTML}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="month-title">${mInfo.name}</div>
    <div class="month-subtitle">${data.subtitle}</div>
    <div class="priorities">
      <h3>Prioriteiten deze maand</h3>
      ${priHTML}
    </div>
    ${catHTML}
  `;
}

function setMonth(id) {
  activeMonth = id;
  renderNav();
  if (id === 'gids') {
    renderGids();
  } else if (id === 'inkoop') {
    renderInkoop();
  } else if (id === 'lagen') {
    renderLagen();
  } else if (id === 'snoei') {
    renderSnoei();
  } else if (id === 'water') {
    renderWater();
  } else if (id === 'moestuin') {
    renderMoestuin();
  } else if (id.startsWith('plantdetail_')) {
    showPlantDetail(id.replace('plantdetail_', ''));
  } else if (id !== 'search') {
    renderContent();
    const si = document.getElementById('searchInput'); if(si) si.value = '';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  { layer:'4', type:'Eenjarig kruid', name:'Korenbloem', emoji:'🔵', roles:'Bestuiver · Eetbare bloem', waarom:'Een van de beste bestuiversplanten van de zomer. Intens blauwe bloemen die bijen en vlinders aantrekken. De bloemblaadjes zijn eetbaar als decoratie op salades en desserts.', wat:'Zaai in april op open plekken. Zaait zichzelf na het eerste jaar vanzelf opnieuw. Laat een deel doorzaaien voor de zaadbank.', letop:'Groeit ook goed op magere droge grond, perfect voor de drogere zones van het perceel.' },
  { layer:'4', type:'Eenjarig kruid', name:'Cosmea', emoji:'🌸', roles:'Bestuiver · Decoratief', waarom:'Lichte vedervormige bloemen die de hele zomer bloeien en massaal bestuivers trekken. Groeit snel en zaait zichzelf elk jaar opnieuw.', wat:'Zaai in april op open plekken. Nauwelijks onderhoud nodig. Laat een deel zaad zetten voor volgend jaar.', letop:'Groeit op bijna elke grondsoort. Goed voor de randen van het voedselbos en rondom de moestuin.' },
  { layer:'4', type:'Tweejarig kruid', name:'Scharlei (Salvia sclarea)', emoji:'🌿', roles:'Medicinaal · Aromatisch · Bestuiver', waarom:'Tweejarige plant met grote harige bladeren en opvallende violette bloemen. Wordt traditioneel gebruikt als kruid voor spijsvertering en als aromatisch ingrediënt. Sterke geur.', wat:'Zaai in april of augustus. Bloeit in het tweede jaar. Blad en bloemen drogen voor medicinaal gebruik.', letop:'Sterk aromatisch, niet voor iedereen. Klein aantal planten is genoeg.' },
  { layer:'4', type:'Vaste plant', name:'Groot kaasjeskruid (Malva)', emoji:'🌸', roles:'Medicinaal · Eetbaar · Bestuiver', waarom:'Eetbare bladeren en bloemen met een milde smaak. Medicinaal bij keel- en bronchitisklachten. De bloemen zijn ook eetbaar als saladedecoratie. Groeit makkelijk op droge arme grond.', letop:'Zaait zichzelf na het eerste jaar vanzelf opnieuw. Droogteresistent, past perfect bij jullie klimaat.', wat:'Zaai in april op open zonnige droge plekken. Bloemen en bladeren plukken doorlopend. Medicinale thee van de bladeren.' },
  { layer:'5', type:'Bodembedekker', name:'Kleine tijm (Thymus serpyllum)', emoji:'🌿', roles:'Kruipende bodembedekker · Droge randen · Bestuiver', waarom:'Kruipt over stenen en droge hellingen als een geurige levende mat. Perfect voor de rotsachtige droge randen van jullie granietperceel waar andere planten het moeilijk hebben.', wat:'Zaai in april of plant op de droge stenen randen en hellingen. Nauwelijks onderhoud. Oogst blad voor in de keuken.', letop:'Anders dan gewone tijm: kruipt horizontaal in plaats van rechtop te groeien. Samen met gewone tijm complementair.' },
  { layer:'4', type:'Vaste plant', name:'Spaanse zuring (Rumex scutatus)', emoji:'🍋', roles:'Mediterraan · Droge randen · Eetbaar', waarom:'Typisch mediterrane plant die groeit op droge rotsachtige hellingen, precies zoals jullie granietachtige perceel. Milde citroenzure smaak, zachter dan gewone zuring. Meerjarig.', wat:'Zaai in april of plant op de droge rotsige randen van het perceel. Bladeren oogsten voor in salades en sauzen. Houdt van droogte.', letop:'Minder invasief dan gewone zuring. Eenmalig planten, blijft meerdere jaren.' },
  { layer:'4', type:'Vaste plant', name:'Citroen Tijm', emoji:'🍋', roles:'Kruid · Vis · Kip · Bestuiver', waarom:'Frisser en citroenachtiger dan gewone tijm. Beter bij vis, kip en lichte gerechten. Staat naast gewone tijm zodat je de keuze hebt.', wat:'Paar takjes meekoken of vers verwerken. Dezelfde droge zonnige plek als gewone tijm in het voedselbos of kruidentuin.', letop:'Zelfde aanpak als gewone tijm. Ze groeien naast elkaar en vullen elkaar aan in de keuken.' },
  { layer:'3', type:'Halfstruik', name:'Rozemarijn', emoji:'🌿', roles:'Insectenafweer · Haarproduct · Keuken · Medicinaal', wanneer:'Planten: het hele jaar. Bloeit februari-april. Oogst blad: het hele jaar.', wat:'Rozemarijnwater (blad in water koken, laten afkoelen) als haarproduct bij roos en haaruitval. Repelleert muggen en motten. Onmisbaar in de Portugese keuken.', letop:'Staat al in het plan. Hier vermeld vanwege de extra functies buiten de keuken.' },
];

const BOMEN_GIDS = [
  // CANOPY
  { layer:'1', type:'Boom', name:'Walnoot (Juglans regia)', emoji:'🌰', roles:'Noot · Canopy · Juglon', waarom:'Geeft jaarlijks een rijke oogst walnoten. Let op: de wortels scheiden juglon uit dat giftig is voor veel andere planten. Plant altijd in de noordhoek ver van fruitbomen.', wat:'Oogst als de groene buitenschil begint te splijten in september. Laat drogen op een droge plek. Bewaar in de schil, duurt maanden.', letop:'6-8m vrij houden van appel, peer, moestuin en blauwe bessen. Kastanje en steeneik zijn juglon-tolerant.' },
  { layer:'1', type:'Boom', name:'Kastanje (Castanea sativa)', emoji:'🌰', roles:'Noot · Canopy · Juglon-tolerant', waarom:'Grote canopy boom die jaarlijks honderden kastanjes produceert. Juglon-tolerant, kan naast de walnoot staan. Groeit langzaam maar wordt oud en groot.', wat:'Oogst in oktober als de stekelige bolsters openspringen en de kastanjes vallen. Vers roosteren, koken of drogen voor meel.', letop:'Heeft kruisbestuiving nodig van een tweede exemplaar. Geeft pas na 7-10 jaar volle productie.' },
  { layer:'1', type:'Boom', name:'Steeneik (Quercus ilex)', emoji:'🌳', roles:'Canopy · Brandwerend · Pionier', waarom:'De brandwerende ruggengraat van het voedselbos. Volledig inheems in de Beira Interior. Geeft eikels als kippenvoer en habitat voor wilde dieren. Groeit langzaam maar wordt heel oud.', wat:'Eikels oogsten in herfst voor kippenvoer of voor het maken van eikelmeel (traditioneel in Portugal).', letop:'Groeit langzaam: eerste 10 jaar bescheiden groei, daarna explosief. Plant hem vroeg.' },
  { layer:'1', type:'Boom', name:'Bunya Pine (Araucaria bidwillii)', emoji:'🌲', roles:'Noot · Spectaculaire boom', waarom:'Prehistorische conifer die enorme kegels produceert met grote eetbare noten. Wordt 30-45 meter hoog. Relatief brandwerend voor een conifer.', wat:'Kegels elke 3 jaar in augustus-september. Kegel weegt tot 10kg: NOOIT onder de boom staan! Noten oogsten uit gevallen kegel, rauw of geroosterd eten.', letop:'Minimaal 10m van wandelpaden vanwege de vallende kegels. Plant eenmalig, één exemplaar genoeg.' },
  // SUB-CANOPY FRUIT
  { layer:'2', type:'Fruitboom', name:'Vijg (Ficus carica)', emoji:'🫐', roles:'Fruit · Mediterraans · Zelffertiel', waarom:'De meest robuuste fruitboom voor jullie klimaat. Groeit op droge arme grond, geen water nodig na vestiging. Geeft twee oogsten per jaar bij de juiste rassen.', wat:'Oogst als de vruchten zacht zijn en beginnen te hangen, nooit hard plukken. Vers eten, drogen of inmaken. Vijgenblad is ook eetbaar als wrap.', letop:'Houdt van arme droge grond, GEEN rijke compost. Plant op goed doorlatende plek. Geeft al vruchten in jaar 2.' },
  { layer:'2', type:'Fruitboom', name:'Granaatappel (Punica granatum)', emoji:'💎', roles:'Fruit · Mediterraans · Droogteresistent', waarom:'Extreem droogteresistent eenmaal gevestigd. Bloeit oranjrood en geeft in september-oktober grote granaatappels. Medicinaal en eetbaar.', wat:'Oogst als de schil begint te barsten of een vol geluid geeft bij kloppen. Zaden eten, sap persen. Uitstekend te bewaren.', letop:'Barst als de bewatering onregelmatig is tijdens de vruchtzetting. Geeft pas volle productie na 3-5 jaar.' },
  { layer:'2', type:'Fruitboom', name:'Kaki (Diospyros kaki)', emoji:'🟠', roles:'Fruit · Late oogst · Vorstbestendig', waarom:'Rijpt in oktober-november als vrijwel niets anders meer rijpt. Vult een leeg gat in de oogstkalender. Astringente rassen worden zoet na lichte vorst.', wat:'Oogst na de eerste lichte vorst (astringente rassen). Vers eten, drogen tot kakis persimons of verwerken. Bewaarbaar tot december.', letop:'Twee soorten: astringent (wacht op vorst) en niet-astringent (eet direct). Vraag de kweker welk type je koopt.' },
  { layer:'2', type:'Fruitboom', name:'Loquat (Eriobotrya japonica)', emoji:'🍑', roles:'Fruit · Vroegste oogst · Winterbloei', waarom:'Bloeit in de winter (uniek) en geeft vruchten in april-mei als er vrijwel niets anders rijp is. Vult het grootste gat in de oogstkalender.', wat:'Oogst als vruchten oranjegeel zijn en zacht aanvoelen. Vers eten, jam maken, inmaken. Groeit ook goed als pot op het terras.', letop:'Bloeit in de winter: houd vliesdoek bij de hand bij nachtvorst. Vorstbescherming tijdens de bloei is cruciaal.' },
  { layer:'2', type:'Fruitboom', name:'Abrikoos (Prunus armeniaca)', emoji:'🍑', roles:'Steenvrucht · Vroege zomer', waarom:'Rijpt als eerste van de steenvruchten in mei-juni. Plantlocatie is cruciaal: bloeit in februari bij de eerste vorst.', wat:'Oogst als vruchten zacht aanvoelen en gemakkelijk loslaten. Vers eten, drogen, jam. Droge abrikozen bewaarbaar maanden.', letop:'Plant op het HOOGSTE punt van het perceel. Niet in een vorstdal waar koude lucht verzamelt. Zelffertiel maar twee rassen geeft meer productie.' },
  { layer:'2', type:'Fruitboom', name:'Perzik (Prunus persica)', emoji:'🍑', roles:'Steenvrucht · Zomer', waarom:'Groeit uitstekend in jullie mediterrane klimaat. Geeft in juli-augustus sappige vruchten. Zelffertiel.', wat:'Oogst als de vrucht zacht aanvoelt bij de steel. Dagelijks controleren want rijpt snel. Vers eten, drogen of inmaken.', letop:'Niet onder de druiplijn van een grote boom (krulziekte). Open luchtige plek. Jaarlijks snoeien voor de beste productie.' },
  { layer:'2', type:'Fruitboom', name:'Nectarine (Prunus persica var. nucipersica)', emoji:'🍑', roles:'Steenvrucht · Zomer · Zelffertiel', waarom:'Gladde variant van de perzik. Zelfde teelt en verzorging. Geeft iets later in het seizoen dan perzik.', wat:'Zelfde aanpak als perzik. Oogst als zacht bij de steel. Nectarines zijn minder vochtgevoelig dan perziken.', letop:'Niet onder de druiplijn van een grote boom. Zelffertiel.' },
  { layer:'2', type:'Fruitboom', name:"Pruim (Prunus domestica) + Damson + Rose of July", emoji:'🫐', roles:'Steenvrucht · Meerdere rassen', waarom:'Drie pruimrassen voor een gespreide oogst van juni (Rose of July) tot augustus. Damson geeft kleine intense pruimen ideaal voor jam.', wat:'Oogst als vruchten gemakkelijk loslaten. Vers eten, drogen, pruimenjam, pruimenjenever. Damson het best voor jam.', letop:'Niet clusteren: verspreid de pruimenrassen door het voedselbos zodat een ziekte niet alles raakt. Ver van walnoot.' },
  { layer:'2', type:'Fruitboom', name:'Kers (Prunus avium)', emoji:'🍒', roles:'Steenvrucht · Zomer', waarom:'Geeft in juni-juli een overvloedige oogst. Vogels zijn er even dol op als jij: vogelnet is geen luxe maar noodzaak.', wat:'Oogst als vruchten diep rood zijn en gemakkelijk loslaten. Snel oogsten want rijpt razendsnel.', letop:'Minimaal 2 rassen nodig voor kruisbestuiving. Vogelnet klaarleggen voor de oogst. Wordt een grote boom: 3-4m ruimte.' },
  { layer:'2', type:'Fruitboom', name:'Appel (Malus domestica)', emoji:'🍎', roles:'Pitvrucht · Herfst', waarom:'Grote productieve fruitboom. Geeft in september-oktober een rijke oogst. Uitstekend bewaarbaar maanden.', wat:'Oogst als vrucht gemakkelijk loslaat bij draaien. Bewaren op koele plek. Appelmoes, appelsap, appelazijn.', letop:'Minimaal 2 rassen nodig. Ver van de walnoot (juglon gevoelig). Jaarlijks licht snoeien voor de beste productie.' },
  { layer:'2', type:'Fruitboom', name:'Peer (Pyrus communis) + Nashipeer', emoji:'🍐', roles:'Pitvrucht · Herfst', waarom:'Peer geeft in augustus-september. Nashipeer (Japanse peer) heeft minder koude-uren nodig, ideaal voor zone 9. Knapperig en sappig.', wat:'Oogst peer als hij gemakkelijk loslaat bij licht optillen. Nashipeer als hij vol gekleurd is. Beiden bewaarbaar.', letop:'Minimaal 2 rassen voor kruisbestuiving. GEEN jeneverbes in de buurt (perenroest). Ver van walnoot.' },
  { layer:'2', type:'Fruitboom', name:'Moerbei (Morus nigra)', emoji:'🍇', roles:'Bessen · Zomer · Halfschaduw', waarom:'Zwarte moerbei geeft in juni-juli intense paarse bessen die lijken op bramen maar zoeter zijn. Traditioneel in de Mediterrane regio.', wat:'Leg een laken onder de boom en schud de takken: bessen vallen vanzelf. Bevlekt alles paars. Vers eten of verwerken tot jam, siroop of wijn.', letop:'Wordt een grote boom (3-4m straal). Plant op een plek waar je de verkleuring op de grond niet erg vindt.' },
  { layer:'2', type:'Fruitboom', name:'Feijoa (Acca sellowiana)', emoji:'🍈', roles:'Subtropisch · Zeldzaam · Eetbare bloem', waarom:'Geeft zoete aromatische vruchten met een smaak tussen ananas en guave. Zeldzaam in Europa maar perfect voor zone 9. Bonus: de bloemblaadjes zijn zoet en eetbaar.', wat:'Oogst als vruchten zacht aanvoelen bij lichte druk. Vers eten (schil niet eten). Bloemblaadjes plukken als saladedecoratie.', letop:'Geeft pas vruchten na 3-5 jaar. Zelfinkoppeling mogelijk maar 2 exemplaren geeft betere productie.' },
  { layer:'2', type:'Fruitboom', name:'Aardbeiboom (Arbutus unedo)', emoji:'🍓', roles:'Inheems · Brandwerend · Eetbaar', waarom:'Volledig inheems in Portugal, groeit in de Serra da Gardunha. Groenblijvend, brandwerend en geeft kleine aardbeiachtige vruchten in november-december.', wat:'Oogst als vruchten volledig rood zijn in november. Smaak is zoet maar licht bitter. Verwerken tot medronho (Portugese aguardente) of jam.', letop:'Groeislang, wordt uiteindelijk 5-8m. Bloeit en geeft vruchten tegelijk in de herfst, bijzonder gezicht.' },
  { layer:'2', type:'Fruitboom', name:'Jujube (Ziziphus jujuba)', emoji:'🟤', roles:'Droogteresistent · Dadel-achtig', waarom:'Extreem droogteresistent, houdt van hitte. Geeft in september dadel-achtige vruchten die zoet en knapperig zijn. Bijna geen onderhoud nodig.', wat:'Oogst als vruchten bruin-rood worden en zacht aanvoelen. Vers eten of drogen. Gedroogd bewaarbaar maanden.', letop:'Zelffertiel. Groeit op de armste drogste grond. Weinig last van ziektes. Ideaal voor de droge hellingen.' },
  { layer:'2', type:'Fruitboom', name:'Kweepeer (Cydonia oblonga)', emoji:'🍋', roles:'Bestuiver · Jam · Vroege bloem', waarom:'Bloeit vroeg in het voorjaar als bestuivermagneet. Geeft harde gele vruchten die rauw niet eetbaar zijn maar tot een heerlijke jam of gelei worden verwerkt.', wat:'Oogst in oktober als vruchten geel zijn. Niet rauw eten. Kweeperengelei, kweeperen jam of membrillo (Spaanse pasta bij kaas).', letop:'Zelffertiel. Gevoelig voor vuurziekte. Plant niet te dicht op peer of appel.' },
  // CITRUS
  { layer:'2', type:'Citrus', name:'Mandarijn (Citrus reticulata)', emoji:'🍊', roles:'Citrus · Winter · Al aanwezig', waarom:'Al aanwezig op het perceel. Geeft in november-januari zoete gemakkelijk te pellen vruchten. De kindvriendelijkste citrus.', wat:'Oogst als vruchten volledig oranje zijn en goed los zitten. Vers eten, sap, of het hele seizoen laten hangen (blijft weken goed aan de boom).', letop:'Geen stikstofbinder binnen 3m van de stam. Bescherming bij vorst <-2°C.' },
  { layer:'2', type:'Citrus', name:'Sinaasappel (Citrus sinensis)', emoji:'🍊', roles:'Citrus · Winter · Al aanwezig', waarom:'Al aanwezig. Geeft in december-februari zoete sappige sinaasappels. Ideaal voor vers sap elke ochtend.', wat:'Oogst als vruchten oranje zijn en goed los zitten. Sap persen, vers eten, oranjemarmelade. Schil drogen voor kruidenthee.', letop:'Geen stikstofbinder binnen 3m. Bescherming bij vorst <-3°C.' },
  { layer:'2', type:'Citrus', name:'Citroen (Citrus limon)', emoji:'🍋', roles:'Citrus · Jaar rond · Meest productief', waarom:'Bloeit en geeft vruchten bijna het hele jaar door. De meest productieve citrusboom in volume. Onmisbaar in de mediterrane keuken.', wat:'Oogst als citroen goed geel is. Sap, schil (zeste), limonade, inmaken, drogen. Altijd vers citroensap beschikbaar.', letop:'Geen stikstofbinder binnen 3m. Bescherming bij vorst <-2°C.' },
  { layer:'2', type:'Citrus', name:'Limoen (Citrus aurantiifolia)', emoji:'🟢', roles:'Citrus · Meest vorstgevoelig', waarom:'Geeft kleine aromatische limoenen met intense smaak. Unieke smaak die citroen niet kan vervangen. Onmisbaar voor Margarita, ceviche, Aziatische keuken.', wat:'Oogst als limoen groen maar vol is. Niet wachten tot geel: dan te rijp. Sap, schil, siroop.', letop:'Meest vorstgevoelig van alle citrus. Plant tegen de warmste zuidmuur. Beschermen bij vorst >-1°C.' },
  { layer:'2', type:'Citrus', name:'Grapefruit + Pomelo', emoji:'🍋', roles:'Citrus · Groot · Bitter-zoet', waarom:'Grapefruit geeft in januari-maart grote bittere vruchten. Pomelo is de grootste citrusvrucht, zoeter dan grapefruit. Beide houden van warmte.', wat:'Oogst als vruchten goed gekleurd zijn. Vers eten, sap persen. Pomelo schil inmaken als snoeperij.', letop:'Beide houden van veel warmte voor de zoetste smaak. Meerdere jaren nodig voor volle smaakrijpheid.' },
  // NOTEN
  { layer:'2', type:'Notenboom', name:'Amandel (Prunus dulcis)', emoji:'🥜', roles:'Noot · Eerste bloei · Februari', waarom:'Bloeit als allereerste in februari samen met abrikoos. Geeft in juli-augustus amandelen als de groene buitenschil barst. Droogteresistent eenmaal gevestigd.', wat:'Oogst als de groene buitenschil barst en de beige schaal zichtbaar wordt. Drogen in de zon. Rauwe amandelen vroeg oogsten als mediterrane delicatesse.', letop:'Minimaal 2 rassen voor kruisbestuiving. Plant op het hoogste beschutte punt samen met abrikoos. Haat natte voeten.' },
  { layer:'2', type:'Notenboom', name:'Hazelnoot (Corylus avellana)', emoji:'🌰', roles:'Noot · Struik · Windbestuiving', waarom:'Geeft jaarlijks hazelnoten in september. Struikvormig, neemt minder ruimte dan een grote notenboom. Windbestuivend.', wat:'Oogst als noten uit de beker vallen. Verzamel van de grond. Rauwen roosteren, hazelnootpasta maken, drogen bewaren.', letop:'Minimaal 2 verschillende rassen naast elkaar nodig voor goede windbestuiving.' },
  { layer:'2', type:'Notenboom', name:'Pistache (Pistacia vera)', emoji:'🟢', roles:'Noot · Droogteresistent · Mediterraans', waarom:'Extreem droogteresistent, eigenlijk een mediterrane woestijnboom. Geeft na 5-7 jaar pistachenoten. Volledig thuis in jullie klimaat.', wat:'Oogst in september als de rode buitenschil begint te barsten. Drogen, roosteren. Pistache-olie persen.', letop:'VERPLICHT mannelijk EN vrouwelijk exemplaar nodig voor productie. Vraag de kweker om de juiste combinatie.' },
  // BESSEN & KLIMPLANTEN
  { layer:'1', type:'Pioniersboom', name:'Populier (Populus)', emoji:'🌳', roles:'Snelste pionier · Biomassa · Langs beek', waarom:'De snelst groeiende boom in het plan. Staat in jaar 3 al 8-10 meter hoog en geeft beschutting en schaduw aan alle andere jonge bomen. Geeft elk jaar enorme hoeveelheden snoeimateriaal als mulch.', wat:'Planten direct langs de beek op vochtige oever. Elk jaar snoeien voor biomassa of laten groeien als windscherm. Na 10-15 jaar eventueel terugzetten als de fruitbomen groot genoeg zijn.', letop:'Niet planten op afstand van gebouwen vanwege het wortelsysteem. Alleen langs de beekzone.' },
  { layer:'2', type:'Boom', name:'Olijf (Olea europaea)', emoji:'🫒', roles:'Eetbaar · Bestaand op perceel · Olieproductie', waarom:'Al aanwezig op het perceel. Extreem droogteresistent, leeft eeuwen. Geeft olijven voor olie en voor direct eten. Volledig inheems in de Mediterrane regio.', wat:'Oogst in oktober-november als olijven van groen naar paars-zwart kleuren. Persen voor olie of inmaken. Jaarlijks snoeien in februari-maart om de kroon open te houden.', letop:'Geen mulch direct tegen de stam, olijf houdt van droge voeten. Snoeihout neerleggen als mulch rondom.' },

  mulch:'10-15cm mulch rondom. Carob heeft diepe wortels en is droogteresistent maar mulch helpt in de eerste jaren.',
  oogst:'September-oktober als peulen bruin en droog zijn. Direct eten (zoet, vergelijkbaar met rozijn smaak). Malen tot carobpoeder als cacaovervanger — geen cafeïne, van nature zoet. Zaden zijn heel hard en traditioneel gebruikt als gewichtsmaat (karaat).',
  voeding:'Carobpoeder per 100g: Suiker 49g (van nature) · Vezels 40g (uitzonderlijk hoog) · Calcium 348mg · IJzer 2.9mg · Kalium 827mg · Geen cafeïne · Geen theobromine (veilig voor honden!).',
  vermeerderen:'Via zaad: harde zaden 24 uur weken voor het zaaien. In april zaaien. Kiemt langzaam. Of koop jonge boompjes bij kweker.',
  buren:'Uitstekende buur voor bijna alles — stikstof die hij produceert helpt omliggende planten. Geen bekende antagonisten.',
  letop:'Dioecisch: mannelijke en vrouwelijke bomen bestaan. Voor vruchtproductie heb je beide nodig. Vraag bij de kweker of je zowel mannelijk als vrouwelijk koopt, of koop een hermafrodiet ras.',
},

  subtitle:'De brandwerende ruggengraat van het Portugese landschap',
  kenmerken:'Hoogte: 10-20m op termijn. Groenblijvend. Kleine leerachtige blaadjes. Eikels in oktober-november. Groeit langzaam maar wordt oud en sterk. Volledig inheems in de Beira Interior.',
  waarom:'De steeneik is de meest brandwerende boom die je kunt planten. Het is ook de boom die het Portugese landschap definieert en het ecosysteem draagt. Eikels zijn voedsel voor wilde dieren, varkens en kippen. De bladval voedt het bodemleven.',
  planten:'Plant in oktober. Kuil 2x potkluit. Geen extra compost nodig — steeneik past op arme grond. Plant op 4-5m straal. Mulch 15cm. De eerste jaren bescheiden groei, wees geduldig.',

  oogst:'Eikels in oktober-november verzamelen. Rauw te bitter door tannines. Eerst ontzuren: eikels 1-2 weken in stromend water weken of meerdere keren koken in vers water. Dan malen tot eikelsmeel. Eikelkoffie is ook mogelijk.',
  voeding:'Eikelsmeel per 100g (ontannineerd): Koolhydraten 55g · Vet 18g (omega-6 hoog) · Eiwit 8g · Vezels 9g · Calcium 46mg.',
  vermeerderen:'Via de eikel zelf: plant in oktober 3-5cm diep. Kiemt in het voorjaar. Groeit langzaam — wees geduldig.',
  buren:'Juglon-tolerant — prima naast walnoot. Carob is een goede buur. Steeneik verdraagt bijna alle buren.',
  letop:'Groeit de eerste 5 jaar traag. Niet ontmoedigd raken. Na jaar 5 versnelt de groei aanzienlijk. Plant hem vroeg in het plan.',
},

'druif': {
  name:'Druif (Vitis vinifera)', emoji:'🍇', layer:'7', type:'Klimplant',
  subtitle:'Langs de pergola en muren — schaduw en zoete druiven',
  kenmerken:'Klimplant tot 10m+ bij ondersteuning. Grote decoratieve bladeren. Bloeit mei-juni (kleine onopvallende bloemen). Oogst augustus-oktober afhankelijk van ras. Verliest bladeren in de winter (mooie herfstkleur).',
  waarom:'Druiven geven langs de pergola tegelijk schaduw voor de zitplek in de zomer, een rijke jaarlijkse oogst en de mogelijkheid voor eigen wijn of druivensap. In Portugal is wijn een cultureel gegeven — de lokale Portugese rassen zijn het proberen waard.',
  planten:'Plant in februari-maart voor de knoppen uitlopen. Kuil 2x potkluit. Rijke compost. Plant aan de voet van pergola of muur. Span draad of rooster voor de ranken. Afstand: 2-3m tussen planten langs pergola.',
  locatie:'Volle zon, goed doorlatende grond. Haat wateroverlast. Pergola, zuidmuur of hek. In jullie plan: langs de pergola bij het hoofdhuis en langs de muren van de bijgebouwen.',
  mulch:'10cm mulch rondom de voet. Houd de directe stam droog.',
  oogst:'Oogst als de druiven zoet zijn — proef regelmatig. Niet wachten op kleur alleen. Druiven blijven weken aan de plant na rijping. Vers eten, drogen tot rozijnen (2-3 weken in de zon), druivensap, wijn.',
  voeding:'Druif per 100g: Suiker 16g · Vitamine K 14.6μg · Resveratrol (antioxidant) aanwezig in donkere rassen · Kalium 191mg · Vitamine C 3.2mg.',
  vermeerderen:'Via stekken in februari: tak van 30-40cm met 3-4 knoppen, onderste knoop in de grond, bovenste buiten. Kiemt gemakkelijk. Uit één druivenplant maak je tientallen stekken per jaar.',
  buren:'Goede buur voor rozemarijn en oregano als onderbeplanting. Passievrucht en bonen kunnen samen omhoog klimmen. Houd weg van walnoot.',
  letop:'VERPLICHT jaarlijks snoeien in februari voor de knoppen uitlopen. Terugsnoeien naar 2 knoppen per scheut. Zonder snoei: mooie plant maar minimale oogst. Snoeien is de sleutel tot druivenproductie.',
},

'gember': {
  name:'Gember (Zingiber officinale)', emoji:'🫚', layer:'6', type:'Rhizoom',
  subtitle:'Vers van de quinta — beter dan alles uit de winkel',
  kenmerken:'Hoogte: 60-120cm als kruid boven de grond. Mooie smalle bladeren. Ondergronds: dikke rhizomen. Meerjarig maar sterft terug bij vorst. In Portugal: behandelen als seizoensgewas.',

  planten:'Plant in april als de grond warm is (>18°C). Rhizoom horizontaal, 5cm diep, knobbels omhoog. Langs de beek in halfschaduw — gember houdt van vochtige grond en verdraagt geen directe hitte. Afstand: 25-30cm.',
  locatie:'Halfschaduw, vochtige grond. Direct langs de beek. Plant samen met kurkuma en zingiber zerumbet op dezelfde beschutte vochtige plek. Niet in volle zon.',
  mulch:'Dikke mulch van 10-15cm is cruciaal voor gember. Houdt de grond vochtig, beschermt de rhizomen en houdt de temperatuur stabiel.',
  oogst:'Oktober als de bladeren beginnen af te sterven na de eerste koude. Graaf voorzichtig rondom de plant. Bewaar een deel van de rhizomen vorstvrij op een droge plek als pootgoed voor april. De rest vers gebruiken of in de vriezer bewaren.',
  voeding:'Verse gember per 100g: Gingerol (anti-inflammatoir, anti-nausea) hoog · Zingibereen (etherische olie) · Vitamine B6 0.16mg · IJzer 0.6mg · Mangaan 0.23mg · Kalium 415mg. Medisch: effectief bij misselijkheid (zwangerschap, reisziekte), spijsvertering, infecties.',
  vermeerderen:'Bewaar een gezonde rhizoom met meerdere knobbels vorstvrij (10-15°C) over de winter. Plant in april opnieuw uit. Uit één rhizoom groei je elk jaar meer.',
  buren:'Goede buur voor kurkuma (zelfde plek). Houdt van de beschutting van hogere planten en struiken rondom.',
  letop:'Gember is vorstgevoelig. Bij de eerste nachtvorst sterft het loof terug. Dan is het tijd om te oogsten. Als je te lang wacht bevriezen de rhizomen ook.',
},

'kamille': {
  name:'Kamille (Matricaria chamomilla)', emoji:'🌼', layer:'5', type:'Eenjarig kruid',

  oogst:'Pluk de bloemen dagelijks als ze volledig open zijn maar het centrum nog vlak is (niet gewelfd). Dan is het gehalte etherische oliën het hoogst. Drogen op een rooster in de schaduw. Bewaren in een glazen pot, weg van licht.',
  voeding:'Kamillebloem bevat: Apigenin (antioxidant, kalmerend) · Bisabolol (anti-inflammatoir) · Chamazuleen (blauwgekleurde olie, anti-allergisch) · Luteoline. Geen significante macro-voedingsstoffen maar rijk aan bioactieve stoffen.',
  vermeerderen:'Zaait zichzelf automatisch als je de bloemen laat uitdrogen aan de plant. Eenmalig zaaien is genoeg voor eeuwig.',
  buren:'Positief effect op appelbomen (guild-combinatie). Goede bestuivermagneet naast alle fruitbomen.',

  oogst:'Bloemen eetbaar als saladedecoratie. Medicinaal: rode klaverextract als fyto-oestrogeen. Zaad oogsten: laat een deel volledig doorbloeien (niet maaien), knip de bruinverkleurde bloemhoofdjes na de bloei, droog een paar dagen op een doek in de schaduw, wrijf tussen de handen om het zaad los te maken, zeef het kaf eruit.',
  voeding:'Klaverbloemen: isoflavonen, Vitamine C, Calcium.',
  vermeerderen:'Zaait zichzelf na het eerste jaar via bloei en zaadval, en verspreidt zich ook vegetatief via ondergrondse uitlopers. Eenmalig zaaien is genoeg om een permanente populatie te starten - vandaar geschikt om op meerdere plekken los te zaaien en zelf van te oogsten voor uitbreiding elders.',
  buren:'Uitstekende buur voor alle fruitbomen als permanente stikstofbinder, ook bij volwassen bomen die verder geen companions nodig hebben.',
  letop:'Op rijke grond kan klaver dominant worden. Op matige grond doet hij precies wat je wil. Verspreidt zich zonder ingrijpen niet gevaarlijk of moeilijk uit te roeien (geen bamboe-risico) - regelmatig maaien of een border/pad houdt hem prima uit zones waar je hem niet wil. Kiemt de eerste 2-3 weken alleen bij constant vochtige grond; in droge septembermaanden om de 2-3 dagen licht water geven tot gevestigd, of wachten tot de eerste herfstregens zodat de natuur het werk doet.',

function handleGidsPlantClick(plantName) {
  const key = findPlantInDB(plantName);
  if (key) showPlantDetail(key);
}

function makePlantClickable(plantName) {
  const dbKey = findPlantInDB(plantName);
  if (dbKey) {
    return `<span class="plant-link" onclick="showPlantDetail('${dbKey}')" title="Klik voor volledige info over ${plantName.split(' x')[0].split('/')[0]}">${plantName} <span style="font-size:10px;color:var(--moss);font-family:'Helvetica Neue',sans-serif">📖 info</span></span>`;
  }
  return plantName;
}

function getPlantId(name) {
  return name.toLowerCase()
    .replace(/\s*\([^)]+\)/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_|_$/g, '')
    .split('_')[0];
}

function buildLayeredGids() {
  const LAYER_META = {
    '1': { label:'🌳 Laag 1 — Canopy (>8m)', color:'#1b5e20', bg:'#e8f5e9', note:'Grote bomen die het dak van het voedselbos vormen. Geven schaduw aan alles eronder. Plant ze vroeg, ze groeien langzaam.' },
    '2': { label:'🌿 Laag 2 — Sub-canopy (3-8m)', color:'#2e7d32', bg:'#f1f8e9', note:'Fruitbomen, notenbomen en kleinere bomen. De productieve kern. Meeste oogst komt van deze laag.' },
    '3': { label:'🌾 Laag 3 — Struik (1-4m)', color:'#827717', bg:'#f9fbe7', note:'Struiken en halfstruiken die de ruimte tussen de bomen vullen. Vaak stikstofbinders, bessen of windscherm.' },
    '4': { label:'🌱 Laag 4 — Kruidenlaag (0.3-1m)', color:'#e65100', bg:'#fff3e0', note:'Vaste planten en kruiden. Guild-planten die de bomen voeden, beschermen en bestuivers aantrekken.' },
    '5': { label:'🍀 Laag 5 — Bodembedekker (<0.3m)', color:'#00695c', bg:'#e0f2f1', note:'Lage kruipende planten die de bodem afdekken. Houden vocht vast, onderdrukken onkruid, voeden bodemleven.' },
    '6': { label:'🥔 Laag 6 — Wortellaag (ondergronds)', color:'#4e342e', bg:'#efebe9', note:'Eetbare wortels, knollen en rhizomen onder de grond. Benutten ruimte die anders ongebruikt blijft.' },
    '7': { label:'🔮 Laag 7 — Klimplant', color:'#6a1b9a', bg:'#f3e5f5', note:'Klimplanten die omhoog groeien langs bomen, pergola of hek. Benutten verticale ruimte efficiënt.' },
  };

  const ALL_PLANTS = [...BOMEN_GIDS, ...GIDS, ...ZELF_GIDS, ...EXP_GIDS];
  const byLayer = {};
  ALL_PLANTS.forEach(p => {
    const l = p.layer || '4';
    if (!byLayer[l]) byLayer[l] = [];
    byLayer[l].push(p);
  });

  return ['1','2','3','4','5','6','7'].map(layerNum => {
    const meta = LAYER_META[layerNum];
    const plants = byLayer[layerNum] || [];
    if (plants.length === 0) return '';
    return `
      <div style="margin-bottom:24px">
        <div style="background:${meta.bg};border-left:5px solid ${meta.color};padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:4px">
          <div style="font-size:14px;font-weight:600;color:${meta.color}">${meta.label}</div>
          <div style="font-size:11px;color:#555;font-family:'Helvetica Neue',sans-serif;margin-top:2px">${meta.note}</div>
        </div>
        <div style="font-size:11px;color:#888;font-family:'Helvetica Neue',sans-serif;margin-bottom:10px;padding-left:4px">${plants.length} planten in deze laag</div>
        ${plants.map(p => plantCard(p, true)).join('')}
      </div>`;
  }).join('');
}

function buildSearchIndex() {
  const index = [];
  const monthNames = {
    jan:'Januari',feb:'Februari',mrt:'Maart',apr:'April',mei:'Mei',jun:'Juni',
    jul:'Juli',aug:'Augustus',sep:'September',okt:'Oktober',nov:'November',dec:'December'
  };
  Object.entries(CAL).forEach(([monthId, monthData]) => {
    if (!monthData.categories) return;
    monthData.categories.forEach(cat => {
      cat.tasks.forEach(task => {
        index.push({
          monthId,
          monthName: monthNames[monthId] || monthId,
          monthSubtitle: monthData.subtitle || '',
          category: cat.name,
          plant: task.plant,
          action: task.action,
          type: task.type,
          note: task.note,
          searchText: (task.plant + ' ' + task.action + ' ' + task.note + ' ' + cat.name).toLowerCase()
        });
      });
    });
  });
  return index;
}

const SEARCH_INDEX = buildSearchIndex();

function highlight(text, query) {
  if (!query) return text;
  const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(regex, '<span class="search-highlight">$1</span>');
}

function handleSearch(val) {
  const q = val.trim().toLowerCase();
  if (q.length < 2) {
    if (activeMonth === 'search') {
      activeMonth = 'okt';
      renderNav();
      renderContent();
    }
    return;
  }
  activeMonth = 'search';
  renderSearch(q, val.trim());
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  if (activeMonth === 'search') setMonth('okt');
}

function renderSearch(q, displayQ) {
  const results = SEARCH_INDEX.filter(item => item.searchText.includes(q));

  if (results.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="month-title">🔍 Zoekresultaten voor "${displayQ}"</div>
      <div class="no-results">Geen resultaten gevonden.<br>Probeer een andere zoekterm.</div>`;
    return;
  }

  // Group by month
  const byMonth = {};
  const monthOrder = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  results.forEach(r => {
    if (!byMonth[r.monthId]) byMonth[r.monthId] = { name: r.monthName, subtitle: r.monthSubtitle, tasks: [] };
    byMonth[r.monthId].tasks.push(r);
  });

  const html = monthOrder
    .filter(m => byMonth[m])
    .map(m => {
      const month = byMonth[m];
      const taskHtml = month.tasks.map(t => {
        const badgeClass = {
          'zaaien':'b-zaaien','planten':'b-planten','oogsten':'b-oogsten',
          'snoeien':'b-snoeien','mulchen':'b-mulchen','knippen':'b-knippen',
          'zaad':'b-zaad','stekken':'b-stekken','water':'b-water',
          'bestellen':'b-bestellen','observeren':'b-observeren','bemesten':'b-bemesten'
        }[t.type] || 'b-observeren';
        return `<div class="task-row">
          <div class="task-header">
            <div class="task-plant">${highlight(t.plant, displayQ)}</div>
            <span class="task-badge ${badgeClass}">${t.action}</span>
          </div>
          <div style="font-size:10px;font-family:'Helvetica Neue',sans-serif;color:var(--stone);margin:2px 0 3px">${t.category}</div>
          <div class="task-note">${highlight(t.note, displayQ)}</div>
        </div>`;
      }).join('');
      return `<div class="category">
        <div class="search-result-month" onclick="setMonth('${m}')" style="cursor:pointer" title="Ga naar ${month.name}">
          ${month.name} — ${month.subtitle} <span style="color:var(--leaf)">↗</span>
        </div>
        ${taskHtml}
      </div>`;
    }).join('');

  document.getElementById('content').innerHTML = `
    <div class="month-title">🔍 Zoekresultaten voor "${displayQ}"</div>
    <div class="month-subtitle">${results.length} resultaten in ${Object.keys(byMonth).length} maanden · klik op een maandnaam om er naartoe te gaan</div>
    ${html}`;
}

function buildLayeredGids() {
  const LAYER_META = {
    '1': { label:'🌳 Laag 1 — Canopy (>8m)', color:'#1b5e20', bg:'#e8f5e9', note:'Grote bomen die het dak van het voedselbos vormen. Geven schaduw aan alles eronder. Plant ze vroeg, ze groeien langzaam.' },
    '2': { label:'🌿 Laag 2 — Sub-canopy (3-8m)', color:'#2e7d32', bg:'#f1f8e9', note:'Fruitbomen, notenbomen en kleinere bomen. De productieve kern. Meeste oogst komt van deze laag.' },
    '3': { label:'🌾 Laag 3 — Struik (1-4m)', color:'#827717', bg:'#f9fbe7', note:'Struiken en halfstruiken die de ruimte tussen de bomen vullen. Vaak stikstofbinders, bessen of windscherm.' },
    '4': { label:'🌱 Laag 4 — Kruidenlaag (0.3-1m)', color:'#e65100', bg:'#fff3e0', note:'Vaste planten en kruiden. Guild-planten die de bomen voeden, beschermen en bestuivers aantrekken.' },
    '5': { label:'🍀 Laag 5 — Bodembedekker (<0.3m)', color:'#00695c', bg:'#e0f2f1', note:'Lage kruipende planten die de bodem afdekken. Houden vocht vast, onderdrukken onkruid, voeden bodemleven.' },
    '6': { label:'🥔 Laag 6 — Wortellaag (ondergronds)', color:'#4e342e', bg:'#efebe9', note:'Eetbare wortels, knollen en rhizomen onder de grond. Benutten ruimte die anders ongebruikt blijft.' },
    '7': { label:'🔮 Laag 7 — Klimplant', color:'#6a1b9a', bg:'#f3e5f5', note:'Klimplanten die omhoog groeien langs bomen, pergola of hek. Benutten verticale ruimte efficiënt.' },
  };

  const ALL_PLANTS = [...BOMEN_GIDS, ...GIDS, ...ZELF_GIDS, ...EXP_GIDS];
  const byLayer = {};
  ALL_PLANTS.forEach(p => {
    const l = p.layer || '4';
    if (!byLayer[l]) byLayer[l] = [];
    byLayer[l].push(p);
  });

  return ['1','2','3','4','5','6','7'].map(layerNum => {
    const meta = LAYER_META[layerNum];
    const plants = byLayer[layerNum] || [];
    if (plants.length === 0) return '';
    return `
      <div style="margin-bottom:24px">
        <div style="background:${meta.bg};border-left:5px solid ${meta.color};padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:4px">
          <div style="font-size:14px;font-weight:600;color:${meta.color}">${meta.label}</div>
          <div style="font-size:11px;color:#555;font-family:'Helvetica Neue',sans-serif;margin-top:2px">${meta.note}</div>
        </div>
        <div style="font-size:11px;color:#888;font-family:'Helvetica Neue',sans-serif;margin-bottom:10px;padding-left:4px">${plants.length} planten in deze laag</div>
        ${plants.map(p => plantCard(p, true)).join('')}
      </div>`;
  }).join('');
}

function renderGids() {
  const sectieHeader = (tekst) => `<div style="font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px">${tekst}</div>`;

  document.getElementById('content').innerHTML = `
    <div class="month-title">📖 Plant Gids</div>
    <div class="month-subtitle">Referentiekaart voor alle planten in het plan — voedselbos, experimenteel en moestuin</div>
    ${buildLayeredGids()}
    ${sectieHeader('🏡 Moestuin')}
    <div style="font-size:12px;color:var(--stone);font-family:'Helvetica Neue',sans-serif;margin-bottom:12px">Moestuinplanten worden per seizoen geteeld en horen niet in het voedselbos-laagensysteem. Ze staan apart hier.</div>

  `;
}
