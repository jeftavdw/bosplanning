<html lang="nl">
<head>

<title>Voedselbos Maandschema — Quinta do Compasso da Água</title>
<style>
  :root {
    --earth: #3d2b1f;
    --stone: #8a7a6a;
    --sand: #f5efe6;
    --moss: #4a6741;
    --leaf: #7a9e72;
    --water: #4a7a8a;
    --bark: #6b4c3b;
    --sun: #c8882a;
    --cream: #faf6f0;
    --white: #ffffff;
    --border: #ddd4c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--cream);
    color: var(--earth);
    min-height: 100vh;
  }

  header {
    background: var(--earth);
    color: var(--sand);
    padding: 20px 24px 16px;
    border-bottom: 3px solid var(--sun);
  }

  header h1 {
    font-size: 17px;
    font-weight: normal;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }

  header p {
    font-size: 12px;
    color: var(--stone);
    font-family: 'Helvetica Neue', sans-serif;
  }

  .month-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 14px 24px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .month-btn {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 11px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--stone);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .month-btn:hover { border-color: var(--leaf); color: var(--moss); }

  .month-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: var(--white);
  }

  .month-btn.critical { border-color: var(--sun); }
  .month-btn.critical.active { background: var(--sun); border-color: var(--sun); }

  .content { padding: 20px 24px 40px; max-width: 900px; }

  .month-title {
    font-size: 22px;
    font-weight: normal;
    color: var(--earth);
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .month-subtitle {
    font-size: 12px;
    color: var(--stone);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 16px;
  }

  .priorities {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-left: 4px solid var(--sun);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .priorities h3 {
    font-size: 11px;
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 10px;
  }

  .priority-item {
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.4;
  }

  .priority-item:last-child { border-bottom: none; }

  .priority-num {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--sun);
    min-width: 18px;
    padding-top: 1px;
  }

  .category {
    margin-bottom: 18px;
  }

  .category-title {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stone);
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .task-row {
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
    background: var(--white);
    border: 1px solid transparent;
    transition: border-color 0.1s;
  }

  .task-row:hover { border-color: var(--border); }

  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 3px;
  }

  .task-plant {
    font-size: 13px;
    font-weight: 600;
    color: var(--earth);
    line-height: 1.3;
    flex: 1;
    word-break: break-word;
  }

  .task-badge {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    display: inline-block;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .task-note {
    font-size: 12px;
    color: var(--stone);
    line-height: 1.45;
    font-family: 'Helvetica Neue', sans-serif;
  }

  /* Badge colors */
  .b-zaaien   { background: #e8f5e9; color: #2e7d32; }
  .b-planten  { background: #e3f2fd; color: #1565c0; }
  .b-oogsten  { background: #fff3e0; color: #e65100; }
  .b-snoeien  { background: #f3e5f5; color: #6a1b9a; }
  .b-mulchen  { background: #efebe9; color: #4e342e; }
  .b-knippen  { background: #f1f8e9; color: #558b2f; }
  .b-zaad     { background: #fffde7; color: #f57f17; }
  .b-stekken  { background: #e0f2f1; color: #00695c; }
  .b-water    { background: #e1f5fe; color: #0277bd; }
  .b-bestellen{ background: #eceff1; color: #37474f; }
  .b-observeren{ background: #fafafa; color: #616161; }
  .b-bemesten { background: #e8f5e9; color: #1b5e20; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px;
    color: var(--stone);
  }

  .empty-month {
    text-align: center;
    padding: 40px;
    color: var(--stone);
    font-style: italic;
  }

  @media (max-width: 600px) {
    .content { padding: 16px; }
    .task-header { flex-wrap: wrap; }
  }
</style>
</head>

let activeMonth = 'okt';



function renderContent() {
  const data = CAL[activeMonth];
  const mInfo = MONTHS.find(m => m.id === activeMonth);
  if (!data) { document.getElementById('content').innerHTML = '<div class="empty-month">Geen data beschikbaar</div>'; return; }

  const priHTML = data.priorities.map((p, i) =>
    `<div class="priority-item"><span class="priority-num">${i+1}</span><span>${p}</span></div>`
  ).join('');

  const catHTML = data.categories.map(cat => {
    const taskHTML = cat.tasks.map(t => {
      const badgeClass = {
        'zaaien':'b-zaaien','planten':'b-planten','oogsten':'b-oogsten',
        'snoeien':'b-snoeien','mulchen':'b-mulchen','knippen':'b-knippen',
        'zaad':'b-zaad','stekken':'b-stekken','water':'b-water',
        'bestellen':'b-bestellen','observeren':'b-observeren','bemesten':'b-bemesten'
      }[t.type] || 'b-observeren';
      return `<div class="task-row">
        <div class="task-header">
          <div class="task-plant">${t.plant}</div>
          <span class="task-badge ${badgeClass}">${t.action}</span>
        </div>
        <div class="task-note">${t.note}</div>
      </div>`;
    }).join('');
    return `<div class="category">
      <div class="category-title">${cat.name}</div>
      ${taskHTML}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="month-title">${mInfo.name}</div>
    <div class="month-subtitle">${data.subtitle}</div>
    <div class="priorities">
      <h3>Prioriteiten deze maand</h3>
      ${priHTML}
    </div>
    ${catHTML}
  `;
}

function setMonth(id) {
  activeMonth = id;
  renderNav();
  if (id === 'gids') {
    renderGids();
  } else if (id === 'inkoop') {
    renderInkoop();
  } else {
    renderContent();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderGids() {
  function plantCard(p, isVoedsel) {
    return `<div style="background:white;border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:6px">
        <div style="font-size:15px;font-weight:600;color:var(--earth)">${p.emoji} ${p.name}</div>
        <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;color:${isVoedsel ? 'var(--moss)' : 'var(--water)'};background:${isVoedsel ? '#e8f5e9' : '#e1f5fe'};padding:3px 8px;border-radius:3px;white-space:nowrap">${p.roles}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <div>
          <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--stone);margin-bottom:3px">${p.wanneer ? 'Wanneer' : 'Waarom'}</div>
          <div style="font-size:12px;line-height:1.5;color:var(--earth)">${p.wanneer || p.waarom}</div>
        </div>
        <div>
          <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--stone);margin-bottom:3px">Wat doe je ermee</div>
          <div style="font-size:12px;line-height:1.5;color:var(--earth)">${p.wat}</div>
        </div>
      </div>
      ${p.letop ? `<div style="margin-top:8px;padding:6px 10px;background:#fff8e1;border-radius:4px;font-size:11px;font-family:'Helvetica Neue',sans-serif;color:#795548"><strong>Let op:</strong> ${p.letop}</div>` : ''}
    </div>`;
  }

  const sectieHeader = (tekst) => `<div style="font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px">${tekst}</div>`;

  document.getElementById('content').innerHTML = `
    <div class="month-title">📖 Plant Gids</div>
    <div class="month-subtitle">Referentiekaart voor alle planten in het plan — voedselbos, experimenteel en moestuin</div>
    ${sectieHeader('🌳 Voedselbos & Guild-planten')}
    ${GIDS.map(p => plantCard(p, true)).join('')}
    ${sectieHeader('🌿 Zelfvoorzienend — reiniging, medicijn, vezel')}
    ${ZELF_GIDS.map(p => plantCard(p, true)).join('')}
    ${sectieHeader('🧪 Experimentele planten')}
    ${EXP_GIDS.map(p => plantCard(p, true)).join('')}
    ${sectieHeader('🏡 Moestuin')}
    ${MOESTUIN_GIDS.map(p => plantCard(p, false)).join('')}
  `;
}
